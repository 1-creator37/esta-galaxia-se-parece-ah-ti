    // --- GENERADOR DE TEXTURAS PROCEDURALES EN HTML CANVAS ---
    function generatePlanetTexture(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      if (type === 'sun') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#ff1493');
        grad.addColorStop(0.5, '#ff66b2');
        grad.addColorStop(1, '#ff80bf');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 400; i++) {
          ctx.fillStyle = 'rgba(255,255,255,0.2)';
          ctx.beginPath();
          ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 8, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'earth') {
        ctx.fillStyle = '#1e3a8a';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.ellipse(w * 0.25, h * 0.4, 120, 90, 0, 0, Math.PI * 2);
        ctx.ellipse(w * 0.32, h * 0.7, 70, 100, 0, 0, Math.PI * 2);
        ctx.ellipse(w * 0.55, h * 0.55, 90, 90, 0, 0, Math.PI * 2);
        ctx.ellipse(w * 0.75, h * 0.38, 160, 100, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (type === 'jupiter' || type === 'saturn') {
        const baseColor = type === 'jupiter' ? '#d4a373' : '#e6c875';
        ctx.fillStyle = baseColor;
        ctx.fillRect(0, 0, w, h);
        for (let y = 0; y < h; y += 12) {
          ctx.fillStyle = y % 24 === 0 ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.15)';
          ctx.fillRect(0, y, w, 6);
        }
      } else {
        const colors = {
          mercury: '#a8a8a8',
          venus: '#e3bb76',
          mars: '#c1440e',
          uranus: '#4bdeed',
          neptune: '#2746d8',
          pluto: '#bfa38a'
        };
        ctx.fillStyle = colors[type] || '#888888';
        ctx.fillRect(0, 0, w, h);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      return texture;
    }

    // --- COMPONENTE CANVAS 3D DEL UNIVERSO ---
    function GalaxyCanvas({ planets, selectedPlanet, onSelectPlanet }) {
      const mountRef = useRef(null);
      const selectedPlanetRef = useRef(selectedPlanet);
      const orbitAngleRef = useRef(new Map());
      const planetMeshesRef = useRef(new Map());

      const isPointerDownRef = useRef(false);
      const previousPointerPosRef = useRef({ x: 0, y: 0 });
      const cameraTargetPosRef = useRef(new THREE.Vector3(0, 40, 115));
      const cameraLookAtRef = useRef(new THREE.Vector3(0, 0, 0));
      const cameraAngleRef = useRef({ theta: 0, phi: 0.55, radius: 115 });

      useEffect(() => {
        selectedPlanetRef.current = selectedPlanet;
      }, [selectedPlanet]);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030712, 0.002);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 2000);
        camera.position.set(0, 40, 115);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Luces
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffeedd, 3.5, 600);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        // Fondo de estrellas
        const starGeo = new THREE.BufferGeometry();
        const starCount = 6000;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
          starPos[i] = (Math.random() - 0.5) * 1200;
          starPos[i + 1] = (Math.random() - 0.5) * 1200;
          starPos[i + 2] = (Math.random() - 0.5) * 1200;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, transparent: true, opacity: 0.8 });
        scene.add(new THREE.Points(starGeo, starMat));

        // Crear Planetas en 3D
        planets.forEach((planet) => {
          const group = new THREE.Group();
          const tex = generatePlanetTexture(planet.textureType);
          const geom = new THREE.SphereGeometry(planet.radius, 48, 48);

          let mat;
          if (planet.type === 'star') {
            mat = new THREE.MeshBasicMaterial({ map: tex });
          } else {
            mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7, metalness: 0.1 });
          }

          const mesh = new THREE.Mesh(geom, mat);
          mesh.name = `${planet.id}_mesh`;
          group.add(mesh);

          // Atmósfera brillante
          if (planet.atmosphereColor) {
            const atmosGeom = new THREE.SphereGeometry(planet.radius * 1.08, 32, 32);
            const atmosMat = new THREE.MeshBasicMaterial({
              color: new THREE.Color(planet.atmosphereColor),
              transparent: true,
              opacity: 0.22,
              side: THREE.BackSide
            });
            group.add(new THREE.Mesh(atmosGeom, atmosMat));
          }

          // Anillos de Saturno / Urano
          if (planet.hasRings) {
            const ringGeom = new THREE.RingGeometry(planet.radius * 1.4, planet.radius * 2.3, 64);
            const ringMat = new THREE.MeshStandardMaterial({
              color: new THREE.Color(planet.ringColor || '#d4a373'),
              side: THREE.DoubleSide,
              transparent: true,
              opacity: 0.85
            });
            const ringMesh = new THREE.Mesh(ringGeom, ringMat);
            ringMesh.rotation.x = Math.PI / 2.3;
            group.add(ringMesh);
          }

          // Línea de Órbita
          if (planet.distance > 0) {
            const orbitCurve = new THREE.EllipseCurve(0, 0, planet.distance, planet.distance, 0, 2 * Math.PI, false, 0);
            const points = orbitCurve.getPoints(120);
            const orbitGeom = new THREE.BufferGeometry().setFromPoints(points.map(p => new THREE.Vector3(p.x, 0, p.y)));
            const orbitMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.25 });
            scene.add(new THREE.LineLoop(orbitGeom, orbitMat));
          }

          scene.add(group);
          planetMeshesRef.current.set(planet.id, group);

          const angle = Math.random() * Math.PI * 2;
          orbitAngleRef.current.set(planet.id, angle);
          if (planet.distance > 0) {
            group.position.x = Math.cos(angle) * planet.distance;
            group.position.z = Math.sin(angle) * planet.distance;
          }
        });

        // Loop de Animación
        let animationFrameId;
        const clock = new THREE.Clock();

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          const delta = clock.getDelta();

          // Movimiento de órbitas y rotación sobre su eje
          planets.forEach((planet) => {
            const group = planetMeshesRef.current.get(planet.id);
            if (!group) return;

            group.rotation.y += delta * 0.8;

            if (planet.distance > 0) {
              let angle = orbitAngleRef.current.get(planet.id) || 0;
              const effectiveSpeed = Math.max(planet.speed * 20.0, 0.28);
              angle += effectiveSpeed * delta;
              orbitAngleRef.current.set(planet.id, angle);

              group.position.x = Math.cos(angle) * planet.distance;
              group.position.z = Math.sin(angle) * planet.distance;
            }
          });

          // Animación suave de la Cámara
          const currentSelected = selectedPlanetRef.current;
          if (currentSelected) {
            const targetGroup = planetMeshesRef.current.get(currentSelected.id);
            if (targetGroup) {
              const planetPos = targetGroup.position;
              cameraLookAtRef.current.lerp(planetPos, 0.08);

              const orbitTime = clock.getElapsedTime() * 0.35;
              const distOffset = currentSelected.radius * 3.8 + 10;
              const targetCamPos = new THREE.Vector3(
                planetPos.x + Math.sin(orbitTime) * distOffset,
                planetPos.y + distOffset * 0.35 + Math.sin(orbitTime * 0.5) * 2,
                planetPos.z + Math.cos(orbitTime) * distOffset
              );
              cameraTargetPosRef.current.copy(targetCamPos);
            }
          } else {
            cameraLookAtRef.current.lerp(new THREE.Vector3(0, 0, 0), 0.05);

            if (!isPointerDownRef.current) {
              cameraAngleRef.current.theta += delta * 0.12;
            }

            const { theta, phi, radius } = cameraAngleRef.current;
            cameraTargetPosRef.current.x = radius * Math.sin(phi) * Math.sin(theta);
            cameraTargetPosRef.current.y = radius * Math.cos(phi);
            cameraTargetPosRef.current.z = radius * Math.sin(phi) * Math.cos(theta);
          }

          camera.position.lerp(cameraTargetPosRef.current, 0.06);
          camera.lookAt(cameraLookAtRef.current);

          renderer.render(scene, camera);
        };

        animate();

        // Controles Táctiles y de Mouse
        const handlePointerDown = (e) => {
          isPointerDownRef.current = true;
          previousPointerPosRef.current = { x: e.clientX, y: e.clientY };
        };

        const handlePointerMove = (e) => {
          if (!isPointerDownRef.current) return;
          const deltaX = e.clientX - previousPointerPosRef.current.x;
          const deltaY = e.clientY - previousPointerPosRef.current.y;

          cameraAngleRef.current.theta -= deltaX * 0.006;
          cameraAngleRef.current.phi -= deltaY * 0.006;
          cameraAngleRef.current.phi = Math.max(0.1, Math.min(Math.PI - 0.1, cameraAngleRef.current.phi));

          previousPointerPosRef.current = { x: e.clientX, y: e.clientY };
        };

        const handlePointerUp = () => {
          isPointerDownRef.current = false;
        };

        const handleWheel = (e) => {
          if (selectedPlanetRef.current) return;
          cameraAngleRef.current.radius = Math.max(35, Math.min(250, cameraAngleRef.current.radius + e.deltaY * 0.08));
        };

        const handleResize = () => {
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
        };

        container.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
        container.addEventListener('wheel', handleWheel);
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(animationFrameId);
          container.removeEventListener('pointerdown', handlePointerDown);
          window.removeEventListener('pointermove', handlePointerMove);
          window.removeEventListener('pointerup', handlePointerUp);
          container.removeEventListener('wheel', handleWheel);
          window.removeEventListener('resize', handleResize);
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, [planets]);

      return <div ref={mountRef} class="w-full h-full absolute inset-0 cursor-grab active:cursor-grabbing" />;
    }

    // --- NAVBAR DE SELECCIÓN DE PLANETAS ---
    function PlanetSelectorNav({ planets, selectedPlanet, onSelectPlanet, onOpenEarthModal }) {

          <button
            onClick={() => onSelectPlanet(null)}
            class={`shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold transition-all duration-200 ${
              !selectedPlanet ? 'bg-indigo-600 text-white shadow-[0_0_12px_rgba(99,102,241,0.5)]' : 'text-slate-300 hover:text-white hover:bg-slate-800/60'
            }`}
          >
            🌌 Vista General
          </button>
          {planets.map((planet) => {
            const isSelected = selectedPlanet?.id === planet.id;
            return (
              <button
                key={planet.id}
                onClick={() => {
                  onSelectPlanet(planet);
                  if (planet.isEarth) {
                    onOpenEarthModal();

                class={`shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1.5 transition-all duration-200 relative ${
                  isSelected
                    ? 'bg-slate-800 text-white border border-pink-400 shadow-[0_0_12px_rgba(244,63,94,0.5)] scale-105'
                    : 'text-slate-300 hover:text-white hover:bg-slate-800/60 border border-transparent'
                }`}
              >
                <span class="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: planet.color }} />
                <span>{planet.spanishName}</span>
              </button>
            );
          })}

      );

    // --- MODAL DE INFORMACIÓN DEL PLANETA ---
    function PlanetCardModal({ planet, planets, onClose, onSelectPlanet, onOpenEarthModal }) {
      if (!planet) return null;
      const currentIndex = planets.findIndex((p) => p.id === planet.id);

      const handlePrev = () => {
        const prevIdx = (currentIndex - 1 + planets.length) % planets.length;
        onSelectPlanet(planets[prevIdx]);
      };

      const handleNext = () => {
        const nextIdx = (currentIndex + 1) % planets.length;
        onSelectPlanet(planets[nextIdx]);
      };

      return (
        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 w-full max-w-lg px-4 pointer-events-auto">
          <div class="bg-slate-900/90 backdrop-blur-xl border border-pink-500/30 rounded-2xl p-5 shadow-[0_10px_35px_rgba(0,0,0,0.8)] text-slate-100 relative overflow-hidden">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full border border-white/20 shadow-md flex items-center justify-center font-bold text-xs" style={{ backgroundColor: planet.color }}>
                  ✨
                </div>
                <div>
                  <h3 class="text-lg font-extrabold text-white">Universo de {planet.spanishName}</h3>
                  <p class="text-xs text-slate-400">Planeta #{currentIndex} del Universo</p>
                </div>
              </div>
              <button onClick={onClose} class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800">
                ✕
              </button>
            </div>

            <div class="my-3 space-y-2">
              <blockquote class="italic text-xs text-pink-300 bg-pink-950/30 border-l-2 border-pink-400 p-2.5 rounded-r-lg">
                "{planet.quote}"
              </blockquote>
              <p class="text-xs text-slate-200 leading-relaxed">{planet.message}</p>
              <div class="text-[11px] text-sky-300 bg-slate-800/50 p-2 rounded-lg border border-slate-700/50">
                💡 <span class="font-bold">Dato Cósmico:</span> {planet.fact}
              </div>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-xs">
              <button onClick={handlePrev} class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
                ← Anterior
              </button>

              {planet.isEarth && (
                <button onClick={onOpenEarthModal} class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-pink-500 to-rose-600 font-bold text-white shadow-md animate-pulse">
                  🎁 Ver Regalo Especial
                </button>
              )}

              <button onClick={handleNext} class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
                Siguiente →
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- REPRODUCTOR MÚSICA ROMÁNTICA ---
    function RomanticMusicPlayer() {
      const [isPlaying, setIsPlaying] = useState(false);

      const togglePlay = () => {
        setIsPlaying(!isPlaying);
      };

      return (
        <div class="bg-slate-900/80 backdrop-blur-md border border-pink-500/30 rounded-full px-4 py-2 flex items-center gap-3 shadow-lg text-xs">
          <button onClick={togglePlay} class="w-7 h-7 rounded-full bg-pink-600 hover:bg-pink-500 flex items-center justify-center text-white font-bold shadow-md">
            {isPlaying ? '⏸' : '▶'}
          </button>
          <div class="flex flex-col">
            <span class="font-bold text-white text-[11px]">Car's Outside - James Arthur</span>
            <span class="text-[9px] text-pink-300">{isPlaying ? 'Reproduciendo...' : 'Música en pausa'}</span>
          </div>
        </div>
      );
    }

    // --- COMPONENTE PRINCIPAL ---
    function App() {
      const [planets] = useState(INITIAL_PLANETS);
      const [selectedPlanet, setSelectedPlanet] = useState(null);
      const [showEarthModal, setShowEarthModal] = useState(false);

      const earthPlanet = planets.find((p) => p.isEarth) || planets[3];

      return (
        <div class="relative w-screen h-screen overflow-hidden bg-slate-950">
          {/* Navegador Superior */}
          <PlanetSelectorNav
            planets={planets}
            selectedPlanet={selectedPlanet}
            onSelectPlanet={setSelectedPlanet}
            onOpenEarthModal={() => setShowEarthModal(true)}
          />

          {/* Canvas 3D de la Galaxia */}
          <GalaxyCanvas
            planets={planets}
            selectedPlanet={selectedPlanet}
            onSelectPlanet={setSelectedPlanet}
          />

          {/* Tarjeta del Planeta Seleccionado */}
          {selectedPlanet && (
            <PlanetCardModal
              planet={selectedPlanet}
              planets={planets}
              onClose={() => setSelectedPlanet(null)}
              onSelectPlanet={setSelectedPlanet}
              onOpenEarthModal={() => setShowEarthModal(true)}
            />
          )}

          {/* Reproductor Flotante de Música */}
          <div class="fixed top-20 left-4 z-40">
            <RomanticMusicPlayer />
          </div>

          {/* Modal Especial de Cumpleaños / Tierra */}
          {showEarthModal && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-pink-500/40 rounded-3xl p-6 max-w-md w-full text-center relative shadow-2xl space-y-4">
                <button onClick={() => setShowEarthModal(false)} class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg font-bold">
                  ✕
                </button>
                <div class="w-16 h-16 mx-auto rounded-full bg-gradient-to-tr from-pink-500 to-indigo-600 flex items-center justify-center text-2xl shadow-lg">
                  🎁
                </div>
                <h2 class="text-2xl font-black text-white">{earthPlanet.friendName}</h2>
                <p class="text-sm text-slate-300 leading-relaxed">{earthPlanet.friendMessage}</p>
                <button onClick={() => setShowEarthModal(false)} class="w-full py-2.5 rounded-xl bg-pink-600 hover:bg-pink-500 font-bold text-white shadow-lg">
                  ¡Gracias, me encanta! ❤️
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
