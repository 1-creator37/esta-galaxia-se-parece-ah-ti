    // --- LOGIN PORTAL COMPONENT ---
    function LoginPortal({ onLoginSuccess }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if ((username.trim().toLowerCase() === 'greys' || username.trim().toLowerCase() === 'greisly') && password === '18') {
          onLoginSuccess();
        } else {
          setError('Credenciales incorrectas. (Pista: Usuario "Greys" / Contraseña "18")');
        }
      };

      return (
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

    // --- THREE.JS GALAXY CANVAS COMPONENT ---
    function GalaxyCanvas({ planets, selectedPlanet, onSelectPlanet }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;

        const width = containerRef.current.clientWidth;
        const height = containerRef.current.clientHeight;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030712, 0.002);

        const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
        camera.position.set(0, 45, 110);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        containerRef.current.appendChild(renderer.domElement);

        // Ambient & Directional Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffffff, 2, 300);
        scene.add(sunLight);

        // Create Starfield
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 4000;
        const starPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
          starPos[i] = (Math.random() - 0.5) * 600;
          starPos[i + 1] = (Math.random() - 0.5) * 600;
          starPos[i + 2] = (Math.random() - 0.5) * 600;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 });
        const starMesh = new THREE.Points(starsGeo, starsMat);
        scene.add(starMesh);

        // Create Sun & Planets
        const planetMeshes = [];
        planets.forEach((p) => {
          const group = new THREE.Group();
          group.name = p.id;

          const geo = new THREE.SphereGeometry(p.radius, 32, 32);
          const mat = new THREE.MeshStandardMaterial({
            color: p.color,
            roughness: 0.7,
            metalness: 0.2
          });

          if (p.type === 'star') {
            mat.emissive = new THREE.Color(p.color);
            mat.emissiveIntensity = 0.8;
          }

          const mesh = new THREE.Mesh(geo, mat);
          group.add(mesh);

          if (p.distance > 0) {
            // Orbit Ring
            const orbitGeo = new THREE.RingGeometry(p.distance - 0.1, p.distance + 0.1, 64);
            const orbitMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.15 });
            const orbitMesh = new THREE.Mesh(orbitGeo, orbitMat);
            orbitMesh.rotation.x = Math.PI / 2;
            scene.add(orbitMesh);
          }

          scene.add(group);
          planetMeshes.push({ group, data: p });
        });

        // Animation Loop
        let animationFrameId;
        const clock = new THREE.Clock();

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          const elapsedTime = clock.getElapsedTime();

          planetMeshes.forEach(({ group, data }) => {
            if (data.distance > 0) {
              const angle = elapsedTime * data.speed;
              group.position.x = Math.cos(angle) * data.distance;
              group.position.z = Math.sin(angle) * data.distance;
            }
            group.rotation.y += 0.005;
          });

          starMesh.rotation.y += 0.0002;

          renderer.render(scene, camera);
        };

        animate();

        const handleResize = () => {
          if (!containerRef.current) return;
          const w = containerRef.current.clientWidth;
          const h = containerRef.current.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };

        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
          if (containerRef.current) {
            containerRef.current.innerHTML = '';
          }
        };
      }, [planets]);

      return <div ref={containerRef} class="w-full h-full cursor-grab active:cursor-grabbing" />;
    }

    // --- PLANET SELECTOR TOP NAVBAR ---
    function PlanetSelectorNav({ planets, selectedPlanet, onSelectPlanet, onOpenEarthModal }) {

          {planets.map((planet) => {
            const isSelected = selectedPlanet?.id === planet.id;
            return (
              <button
                key={planet.id}
                onClick={() => onSelectPlanet(planet)}
                class={`px-3 py-1.5 rounded-full text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap ${
                  isSelected
                    ? 'bg-slate-800 text-white border border-pink-400 shadow-[0_0_12px_rgba(244,63,94,0.5)] scale-105'
                    : 'text-slate-300 hover:text-white hover:bg-slate-800/60 border border-transparent'
                }`}
              >
                <span class="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: planet.color }} />
                <span>{planet.spanishName}</span>
              </button>
            );
          })}
        </div>
      );
    }

    // --- PLANET CARD MODAL COMPONENT ---
    function PlanetCardModal({ planet, planets, onClose, onSelectPlanet, onOpenEarthModal }) {
      if (!planet) return null;
      const currentIndex = planets.findIndex((p) => p.id === planet.id);

      const handlePrev = () => {
        const prevIdx = (currentIndex - 1 + planets.length) % planets.length;
        onSelectPlanet(planets[prevIdx]);
      };

      const handleNext = () => {
        const nextIdx = (currentIndex + 1) % planets.length;
        onSelectPlanet(planets[nextIdx]);
      };

      return (
        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 w-full max-w-lg px-4 pointer-events-auto">
          <div class="bg-slate-900/90 backdrop-blur-xl border border-pink-500/30 rounded-2xl p-5 shadow-[0_10px_35px_rgba(0,0,0,0.8)] text-slate-100 relative overflow-hidden">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full border border-white/20 shadow-md flex items-center justify-center font-bold text-xs" style={{ backgroundColor: planet.color }}>
                  ✨
                </div>
                <div>
                  <h3 class="text-lg font-extrabold text-white">Universo de {planet.spanishName}</h3>
                  <p class="text-xs text-slate-400">Planeta #{currentIndex} del Universo</p>
                </div>
              </div>
              <button onClick={onClose} class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800">
                ✕
              </button>
            </div>

            <div class="my-3 space-y-2">
              <blockquote class="italic text-xs text-pink-300 bg-pink-950/30 border-l-2 border-pink-400 p-2.5 rounded-r-lg">
                "{planet.quote}"
              </blockquote>
              <p class="text-xs text-slate-200 leading-relaxed">{planet.message}</p>
              <div class="text-[11px] text-sky-300 bg-slate-800/50 p-2 rounded-lg border border-slate-700/50">
                💡 <span class="font-bold">Dato Cósmico:</span> {planet.fact}
              </div>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-xs">
              <button onClick={handlePrev} class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
                ← Anterior
              </button>

              {planet.isEarth && (
                <button onClick={onOpenEarthModal} class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-pink-500 to-rose-600 font-bold text-white shadow-md animate-pulse">
                  🎁 Ver Regalo Especial
                </button>

              <button onClick={handleNext} class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
                Siguiente →
              </button>
            </div>
          </div>
        </div>
      );

    // --- ROMANTIC MUSIC PLAYER COMPONENT ---
    function RomanticMusicPlayer() {
      const [isPlaying, setIsPlaying] = useState(false);

      const togglePlay = () => {
        setIsPlaying(!isPlaying);
      };

      return (
        <div class="bg-slate-900/80 backdrop-blur-md border border-pink-500/30 rounded-full px-4 py-2 flex items-center gap-3 shadow-lg text-xs">
          <button onClick={togglePlay} class="w-7 h-7 rounded-full bg-pink-600 hover:bg-pink-500 flex items-center justify-center text-white font-bold shadow-md">
            {isPlaying ? '⏸' : '▶'}
          </button>
          <div class="flex flex-col">
            <span class="font-bold text-white text-[11px]">Car's Outside - James Arthur</span>
            <span class="text-[9px] text-pink-300">{isPlaying ? 'Reproduciendo música...' : 'Música en pausa'}</span>
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT WITH LOGIN ---
    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [planets] = useState(INITIAL_PLANETS);
      const [selectedPlanet, setSelectedPlanet] = useState(null);
      const [showEarthModal, setShowEarthModal] = useState(false);

      const earthPlanet = planets.find((p) => p.isEarth) || planets[3];

      if (!isLoggedIn) {
        return <LoginPortal onLoginSuccess={() => setIsLoggedIn(true)} />;
      }

      return (
        <div class="relative w-screen h-screen overflow-hidden bg-slate-950">
          <PlanetSelectorNav
            planets={planets}
            selectedPlanet={selectedPlanet}
            onSelectPlanet={setSelectedPlanet}
            onOpenEarthModal={() => setShowEarthModal(true)}
          />

          <GalaxyCanvas
            planets={planets}
            selectedPlanet={selectedPlanet}
            onSelectPlanet={setSelectedPlanet}
          />

          {selectedPlanet && (
            <PlanetCardModal
              planet={selectedPlanet}
              planets={planets}
              onClose={() => setSelectedPlanet(null)}
              onSelectPlanet={setSelectedPlanet}
              onOpenEarthModal={() => setShowEarthModal(true)}
            />
          )}

          <div class="fixed top-20 left-4 z-40">
            <RomanticMusicPlayer />
          </div>

          <button
            onClick={() => setIsLoggedIn(false)}
            class="fixed top-20 right-4 z-40 px-3 py-1.5 bg-slate-900/80 hover:bg-slate-800 border border-slate-700 text-slate-300 text-xs font-bold rounded-full shadow-lg"
          >
            🔒 Cerrar Sesión
          </button>

          {showEarthModal && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-pink-500/40 rounded-3xl p-6 max-w-md w-full text-center relative shadow-2xl space-y-4">
                <button onClick={() => setShowEarthModal(false)} class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg font-bold">
                  ✕
                </button>
                <div class="w-16 h-16 mx-auto rounded-full bg-gradient-to-tr from-pink-500 to-indigo-600 flex items-center justify-center text-2xl shadow-lg">
                  🎁
                </div>
                <h2 class="text-2xl font-black text-white">{earthPlanet.friendName}</h2>
                <p class="text-sm text-slate-300 leading-relaxed">{earthPlanet.friendMessage}</p>
                <button onClick={() => setShowEarthModal(false)} class="w-full py-2.5 rounded-xl bg-pink-600 hover:bg-pink-500 font-bold text-white shadow-lg">
                  ¡Gracias, me encanta! ❤️
                </button>
              </div>
            </div>
          )}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
