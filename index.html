    // --- TEXTURAS GENERADAS ---
    function generatePlanetTexture(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      if (type === 'sun') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#ff1493');
        grad.addColorStop(0.5, '#ff66b2');
        grad.addColorStop(1, '#ff80bf');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      } else if (type === 'earth') {
        ctx.fillStyle = '#1d4ed8';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.ellipse(w * 0.25, h * 0.4, 130, 95, 0, 0, Math.PI * 2);
        ctx.ellipse(w * 0.75, h * 0.38, 170, 110, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = type === 'mars' ? '#c1440e' : (type === 'jupiter' ? '#d4a373' : '#3b82f6');
        ctx.fillRect(0, 0, w, h);
      }

      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }
